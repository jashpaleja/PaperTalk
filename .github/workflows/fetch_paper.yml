name: Fetch and Notify

on:
  schedule:
    - cron: "0 09 * * *" 
  workflow_dispatch: 

# ADDED: This grants the GitHub Action permission to push files to the repo
permissions:
  contents: write

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install arxiv pyTelegramBotAPI
      
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python fetch_and_notify.py
        
      # Save the updated JSON database back to the repository so the next run remembers the count
      - name: Commit and Push Database
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_database.json
          
          # Only commit and push if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update paper database queue" && git push "https://${GH_TOKEN}@github.com/${{ github.repository }}.git")