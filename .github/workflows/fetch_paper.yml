name: Fetch and Notify

on:
  schedule:
    - cron: "0 09 * * *" 
  workflow_dispatch: 

# ADDED: This grants the GitHub Action permission to push files to the repo
permissions:
  contents: write

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install arxiv pyTelegramBotAPI
      
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_and_notify.py
        
      # ADDED: This commits the updated sent_papers.txt file back to the repo
      - name: Save sent papers state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_papers.txt
          git commit -m "Update sent papers list" || echo "No new papers sent today"
          git push || echo "Nothing to push"